# Use hosted DB / Redis: set DATABASE_URL and REDIS_URL in each service .env below.
# Optional local infra (only when you need Postgres or Redis inside Docker):
#   docker compose --profile local-db --profile local-redis up --build

services:
  postgres:
    profiles:
      - local-db
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: jibbr
      POSTGRES_PASSWORD: jibbr_password
      POSTGRES_DB: jibbr_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Without -d, pg_isready targets a DB named like the user ("jibbr"), which we do not create
      test: ['CMD-SHELL', 'pg_isready -U jibbr -d jibbr_db']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    profiles:
      - local-redis
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    ports:
      - '3001:3001'
    env_file:
      - services/auth-service/.env

  upload-service:
    build:
      context: .
      dockerfile: services/upload-service/Dockerfile
    ports:
      - '3002:3002'
    env_file:
      - services/upload-service/.env

  messaging-service:
    build:
      context: .
      dockerfile: services/messaging-service/Dockerfile
    ports:
      - '3003:3003'
    env_file:
      - services/messaging-service/.env

  socket-service:
    build:
      context: .
      dockerfile: services/socket-service/Dockerfile
    ports:
      - '3004:3004'
    env_file:
      - services/socket-service/.env

  call-service:
    build:
      context: .
      dockerfile: services/call-service/Dockerfile
    ports:
      - '3005:3005'
      - '40000-49999:40000-49999/udp'
    env_file:
      - services/call-service/.env
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3005/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
