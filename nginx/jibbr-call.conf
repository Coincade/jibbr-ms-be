# Call-service reverse proxy (HTTPS REST only).
# WebRTC UDP 40000-49999 stays direct to the Droplet — not proxied here.
#
# Install on Droplet:
#   sudo cp nginx/jibbr-call.conf /etc/nginx/sites-available/jibbr-call
#   sudo ln -sf /etc/nginx/sites-available/jibbr-call /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d call.jibbr.com

server {
    listen 80;
    server_name call.jibbr.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name call.jibbr.com;

    # certbot --nginx fills these automatically:
    # ssl_certificate     /etc/letsencrypt/live/call.jibbr.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/call.jibbr.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
