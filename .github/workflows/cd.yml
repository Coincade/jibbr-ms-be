name: CD

on:
  push:
    branches: [main, dev]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  REGISTRY: docker.io
  DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_NAMESPACE }}

jobs:
  changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      upload: ${{ steps.filter.outputs.upload }}
      messaging: ${{ steps.filter.outputs.messaging }}
      socket: ${{ steps.filter.outputs.socket }}
      call: ${{ steps.filter.outputs.call }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth:
              - 'services/auth-service/**'
              - 'packages/**'
              - 'package*.json'
              - 'turbo.json'
            upload:
              - 'services/upload-service/**'
              - 'packages/**'
              - 'package*.json'
              - 'turbo.json'
            messaging:
              - 'services/messaging-service/**'
              - 'packages/**'
              - 'package*.json'
              - 'turbo.json'
            socket:
              - 'services/socket-service/**'
              - 'packages/**'
              - 'package*.json'
              - 'turbo.json'
            call:
              - 'services/call-service/**'
              - 'packages/**'
              - 'package*.json'
              - 'turbo.json'
              - 'docker-compose.call-image.yml'
              - 'scripts/publish-call-image.sh'
              - 'scripts/check-call-service-health.sh'
              - 'scripts/deploy-call-service-remote.sh'

  build-app-images:
    name: Build & Push App Image — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            changed: ${{ needs.changes.outputs.auth }}
          - service: upload-service
            changed: ${{ needs.changes.outputs.upload }}
          - service: messaging-service
            changed: ${{ needs.changes.outputs.messaging }}
          - service: socket-service
            changed: ${{ needs.changes.outputs.socket }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ matrix.changed == 'true' }}

      - name: Log in to Docker Hub
        if: ${{ matrix.changed == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tag
        if: ${{ matrix.changed == 'true' }}
        id: tag
        run: echo "IMAGE=${{ env.REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.service }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        if: ${{ matrix.changed == 'true' }}
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          docker build \
            --file services/${{ matrix.service }}/Dockerfile \
            --tag "${{ steps.tag.outputs.IMAGE }}" \
            --tag "${{ env.REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.service }}:latest" \
            --cache-from "${{ env.REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.service }}:latest" \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            .

      - name: Push Docker image
        if: ${{ matrix.changed == 'true' }}
        run: |
          docker push "${{ steps.tag.outputs.IMAGE }}"
          docker push "${{ env.REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.service }}:latest"

  build-call-image:
    name: Build & Push Call Image
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.call == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build call-service image
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          docker build \
            --platform linux/amd64 \
            --file services/call-service/Dockerfile \
            --tag "${{ env.REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/jibbr-call-service:${{ github.sha }}" \
            --tag "${{ env.REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/jibbr-call-service:webrtc-ms" \
            --cache-from "${{ env.REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/jibbr-call-service:webrtc-ms" \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            .

      - name: Push call-service image
        run: |
          docker push "${{ env.REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/jibbr-call-service:${{ github.sha }}"
          docker push "${{ env.REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/jibbr-call-service:webrtc-ms"

  migrate-staging:
    name: Database Migration — Staging
    runs-on: ubuntu-latest
    needs: [build-app-images, build-call-image]
    if: ${{ always() && github.ref_name == 'dev' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

      - name: Run Prisma migrations
        run: npx prisma migrate deploy
        working-directory: packages/database
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

  migrate-production:
    name: Database Migration — Production
    runs-on: ubuntu-latest
    needs: [build-app-images, build-call-image]
    if: ${{ always() && github.ref_name == 'main' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

      - name: Run Prisma migrations
        run: npx prisma migrate deploy
        working-directory: packages/database
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

  deploy-apps-staging:
    name: Deploy Staging App — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [changes, migrate-staging]
    if: ${{ github.ref_name == 'dev' }}
    environment: staging
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            changed: ${{ needs.changes.outputs.auth }}
            app_id_secret: STAGING_DO_AUTH_APP_ID
          - service: upload-service
            changed: ${{ needs.changes.outputs.upload }}
            app_id_secret: STAGING_DO_UPLOAD_APP_ID
          - service: messaging-service
            changed: ${{ needs.changes.outputs.messaging }}
            app_id_secret: STAGING_DO_MESSAGING_APP_ID
          - service: socket-service
            changed: ${{ needs.changes.outputs.socket }}
            app_id_secret: STAGING_DO_SOCKET_APP_ID
    steps:
      - name: Install doctl
        if: ${{ matrix.changed == 'true' }}
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Update App Platform image tag
        if: ${{ matrix.changed == 'true' }}
        run: |
          APP_ID="${{ secrets[matrix.app_id_secret] }}"
          TMP_SPEC="$(mktemp)"
          APP_JSON="$(mktemp)"

          doctl apps get "$APP_ID" -o json > "$APP_JSON"
          jq -e 'length > 0 and .[0].spec != null' "$APP_JSON" >/dev/null

          jq -e '.[0].spec' "$APP_JSON" | jq \
            --arg component "${{ matrix.service }}" \
            --arg tag "${{ github.sha }}" \
            '
              .services = (.services // [] | map(
                if .name == $component and .image != null
                then .image.tag = $tag | .
                else .
                end
              ))
            ' > "$TMP_SPEC"

          doctl apps update "$APP_ID" --spec "$TMP_SPEC"

      - name: Trigger deployment
        if: ${{ matrix.changed == 'true' }}
        id: deploy_trigger
        run: |
          APP_ID="${{ secrets[matrix.app_id_secret] }}"
          DEPLOYMENT_ID=$(doctl apps create-deployment "$APP_ID" -o json | jq -r '.[0].id // .id // empty')
          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "Failed to read deployment ID from doctl output"
            exit 1
          fi
          echo "DEPLOYMENT_ID=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment to go live
        if: ${{ matrix.changed == 'true' }}
        run: |
          APP_ID="${{ secrets[matrix.app_id_secret] }}"
          DEPLOYMENT_ID="${{ steps.deploy_trigger.outputs.DEPLOYMENT_ID }}"
          echo "Waiting for ${{ matrix.service }} deployment $DEPLOYMENT_ID to reach ACTIVE state..."
          for i in $(seq 1 45); do
            STATUS=$(doctl apps get-deployment "$APP_ID" "$DEPLOYMENT_ID" --format Phase --no-header 2>/dev/null || echo "UNKNOWN")
            echo "Attempt $i: $STATUS"
            if [ "$STATUS" = "ACTIVE" ]; then
              echo "${{ matrix.service }} is live"
              exit 0
            fi
            if [ "$STATUS" = "ERROR" ] || [ "$STATUS" = "CANCELED" ] || [ "$STATUS" = "SUPERSEDED" ]; then
              echo "${{ matrix.service }} deployment failed with status: $STATUS"
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for ${{ matrix.service }} deployment $DEPLOYMENT_ID"
          exit 1

  deploy-apps-production:
    name: Deploy Production App — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [changes, migrate-production]
    if: ${{ github.ref_name == 'main' }}
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            changed: ${{ needs.changes.outputs.auth }}
            app_id_secret: PRODUCTION_DO_AUTH_APP_ID
          - service: upload-service
            changed: ${{ needs.changes.outputs.upload }}
            app_id_secret: PRODUCTION_DO_UPLOAD_APP_ID
          - service: messaging-service
            changed: ${{ needs.changes.outputs.messaging }}
            app_id_secret: PRODUCTION_DO_MESSAGING_APP_ID
          - service: socket-service
            changed: ${{ needs.changes.outputs.socket }}
            app_id_secret: PRODUCTION_DO_SOCKET_APP_ID
    steps:
      - name: Install doctl
        if: ${{ matrix.changed == 'true' }}
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Update App Platform image tag
        if: ${{ matrix.changed == 'true' }}
        run: |
          APP_ID="${{ secrets[matrix.app_id_secret] }}"
          TMP_SPEC="$(mktemp)"
          APP_JSON="$(mktemp)"

          doctl apps get "$APP_ID" -o json > "$APP_JSON"
          jq -e 'length > 0 and .[0].spec != null' "$APP_JSON" >/dev/null

          jq -e '.[0].spec' "$APP_JSON" | jq \
            --arg component "${{ matrix.service }}" \
            --arg tag "${{ github.sha }}" \
            '
              .services = (.services // [] | map(
                if .name == $component and .image != null
                then .image.tag = $tag | .
                else .
                end
              ))
            ' > "$TMP_SPEC"

          doctl apps update "$APP_ID" --spec "$TMP_SPEC"

      - name: Trigger deployment
        if: ${{ matrix.changed == 'true' }}
        id: deploy_trigger
        run: |
          APP_ID="${{ secrets[matrix.app_id_secret] }}"
          DEPLOYMENT_ID=$(doctl apps create-deployment "$APP_ID" -o json | jq -r '.[0].id // .id // empty')
          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "Failed to read deployment ID from doctl output"
            exit 1
          fi
          echo "DEPLOYMENT_ID=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment to go live
        if: ${{ matrix.changed == 'true' }}
        run: |
          APP_ID="${{ secrets[matrix.app_id_secret] }}"
          DEPLOYMENT_ID="${{ steps.deploy_trigger.outputs.DEPLOYMENT_ID }}"
          echo "Waiting for ${{ matrix.service }} deployment $DEPLOYMENT_ID to reach ACTIVE state..."
          for i in $(seq 1 45); do
            STATUS=$(doctl apps get-deployment "$APP_ID" "$DEPLOYMENT_ID" --format Phase --no-header 2>/dev/null || echo "UNKNOWN")
            echo "Attempt $i: $STATUS"
            if [ "$STATUS" = "ACTIVE" ]; then
              echo "${{ matrix.service }} is live"
              exit 0
            fi
            if [ "$STATUS" = "ERROR" ] || [ "$STATUS" = "CANCELED" ] || [ "$STATUS" = "SUPERSEDED" ]; then
              echo "${{ matrix.service }} deployment failed with status: $STATUS"
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for ${{ matrix.service }} deployment $DEPLOYMENT_ID"
          exit 1

  deploy-call-staging:
    name: Deploy Staging Call Service
    runs-on: ubuntu-latest
    needs: [changes, build-call-image, migrate-staging]
    if: ${{ github.ref_name == 'dev' && needs.changes.outputs.call == 'true' }}
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_CALL_DROPLET_SSH_KEY }}

      - name: Add droplet host key
        run: ssh-keyscan -H "${{ secrets.STAGING_CALL_DROPLET_HOST }}" >> ~/.ssh/known_hosts

      - name: Write remote env file
        run: |
          printf '%s' '${{ secrets.STAGING_CALL_SERVICE_ENV }}' > /tmp/call-service.env
          scp /tmp/call-service.env "${{ secrets.STAGING_CALL_DROPLET_USER }}@${{ secrets.STAGING_CALL_DROPLET_HOST }}:/opt/jibbr-ms-be/services/call-service/.env"

      - name: Deploy call-service over SSH
        env:
          CALL_IMAGE: ${{ env.REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/jibbr-call-service:${{ github.sha }}
        run: |
          ssh "${{ secrets.STAGING_CALL_DROPLET_USER }}@${{ secrets.STAGING_CALL_DROPLET_HOST }}" \
            "cd /opt/jibbr-ms-be && chmod +x scripts/deploy-call-service-remote.sh && CALL_IMAGE='${CALL_IMAGE}' ./scripts/deploy-call-service-remote.sh"

  deploy-call-production:
    name: Deploy Production Call Service
    runs-on: ubuntu-latest
    needs: [changes, build-call-image, migrate-production]
    if: ${{ github.ref_name == 'main' && needs.changes.outputs.call == 'true' }}
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PRODUCTION_CALL_DROPLET_SSH_KEY }}

      - name: Add droplet host key
        run: ssh-keyscan -H "${{ secrets.PRODUCTION_CALL_DROPLET_HOST }}" >> ~/.ssh/known_hosts

      - name: Write remote env file
        run: |
          printf '%s' '${{ secrets.PRODUCTION_CALL_SERVICE_ENV }}' > /tmp/call-service.env
          scp /tmp/call-service.env "${{ secrets.PRODUCTION_CALL_DROPLET_USER }}@${{ secrets.PRODUCTION_CALL_DROPLET_HOST }}:/opt/jibbr-ms-be/services/call-service/.env"

      - name: Deploy call-service over SSH
        env:
          CALL_IMAGE: ${{ env.REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/jibbr-call-service:${{ github.sha }}
        run: |
          ssh "${{ secrets.PRODUCTION_CALL_DROPLET_USER }}@${{ secrets.PRODUCTION_CALL_DROPLET_HOST }}" \
            "cd /opt/jibbr-ms-be && chmod +x scripts/deploy-call-service-remote.sh && CALL_IMAGE='${CALL_IMAGE}' ./scripts/deploy-call-service-remote.sh"

  smoke-staging:
    name: Smoke Test — Staging
    runs-on: ubuntu-latest
    needs: [deploy-apps-staging, deploy-call-staging]
    if: ${{ always() && github.ref_name == 'dev' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    environment: staging
    env:
      AUTH_URL: ${{ secrets.STAGING_AUTH_URL }}
      UPLOAD_URL: ${{ secrets.STAGING_UPLOAD_URL }}
      MESSAGING_URL: ${{ secrets.STAGING_MESSAGING_URL }}
      SOCKET_URL: ${{ secrets.STAGING_SOCKET_URL }}
      CALL_URL: ${{ secrets.STAGING_CALL_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Health-check App Platform services
        run: |
          normalize_url() { echo "${1%/}"; }
          services=(
            "$(normalize_url "${AUTH_URL}")/health"
            "$(normalize_url "${UPLOAD_URL}")/health"
            "$(normalize_url "${MESSAGING_URL}")/health"
            "$(normalize_url "${SOCKET_URL}")/health"
          )
          for url in "${services[@]}"; do
            echo "Checking $url"
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$url")
            if [ "$STATUS" != "200" ]; then
              echo "FAIL: $url returned HTTP $STATUS"
              exit 1
            fi
            echo "OK: $url"
          done

      - name: Health-check call-service
        run: |
          chmod +x ./scripts/check-call-service-health.sh
          CALL_SERVICE_URL="${CALL_URL}" ./scripts/check-call-service-health.sh

  smoke-production:
    name: Smoke Test — Production
    runs-on: ubuntu-latest
    needs: [deploy-apps-production, deploy-call-production]
    if: ${{ always() && github.ref_name == 'main' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    environment: production
    env:
      AUTH_URL: ${{ secrets.PRODUCTION_AUTH_URL }}
      UPLOAD_URL: ${{ secrets.PRODUCTION_UPLOAD_URL }}
      MESSAGING_URL: ${{ secrets.PRODUCTION_MESSAGING_URL }}
      SOCKET_URL: ${{ secrets.PRODUCTION_SOCKET_URL }}
      CALL_URL: ${{ secrets.PRODUCTION_CALL_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Health-check App Platform services
        run: |
          normalize_url() { echo "${1%/}"; }
          services=(
            "$(normalize_url "${AUTH_URL}")/health"
            "$(normalize_url "${UPLOAD_URL}")/health"
            "$(normalize_url "${MESSAGING_URL}")/health"
            "$(normalize_url "${SOCKET_URL}")/health"
          )
          for url in "${services[@]}"; do
            echo "Checking $url"
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$url")
            if [ "$STATUS" != "200" ]; then
              echo "FAIL: $url returned HTTP $STATUS"
              exit 1
            fi
            echo "OK: $url"
          done

      - name: Health-check call-service
        run: |
          chmod +x ./scripts/check-call-service-health.sh
          CALL_SERVICE_URL="${CALL_URL}" ./scripts/check-call-service-health.sh
